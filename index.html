<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión Multiplica: Edición Cifras</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #app {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            background: #1b263b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #4158D0;
            padding: 12px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd166;
            border-bottom: 4px solid #118ab2;
            flex-shrink: 0;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #1b263b;
            z-index: 5;
        }
        .screen.hidden {
            display: none !important;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #ffd166;
        }
        p {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #e0fbfc;
        }
        
        /* Botón de Modo Sin Tiempo / Con Tiempo */
        .mode-toggle-btn {
            background: #06d6a0;
            color: #0d1b2a;
            border: 3px solid #ffd166;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 #049a72;
        }

        .btn {
            background-color: #118ab2;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0b5c77;
            margin: 8px 0;
            width: 100%;
            max-width: 300px;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0b5c77;
        }

        /* Zona de Juego */
        .hud-concurso {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            border-bottom: 2px solid #118ab2;
        }
        .panel-pregunta {
            font-size: 2.8rem;
            color: #ffd166;
            margin: 20px 0;
            background: #0d1b2a;
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid #118ab2;
            letter-spacing: 2px;
        }
        .grid-opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }
        .opcion-btn {
            background: #2b2d42;
            border: 3px solid #06d6a0;
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        .timer-bar {
            width: 100%;
            height: 10px;
            background: #ef476f;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="app">
    <header>Misión Multiplica</header>

    <!-- Pantalla de Inicio -->
    <div id="screen-home" class="screen">
        <h2>Gran Concurso Mental</h2>
        <p>Aprende matemáticas sin agobios.</p>
        
        <!-- Botón muy visible para alternar Sin Tiempo / Con Tiempo -->
        <button class="mode-toggle-btn" id="btn-mode-toggle" onclick="Game.toggleTimerMode()">
            🐢 Modo: SIN TIEMPO (Calma absoluta)
        </button>

        <button class="btn" style="background-color: #06d6a0; color: #0d1b2a; box-shadow: 0 4px 0 #049a72;" onclick="Game.startMode('tablas')">Tablas de Multiplicar</button>
        <button class="btn" onclick="Game.startMode('cifras')">Cifras Exactas</button>
        <button class="btn" style="background:#ef476f; box-shadow: 0 4px 0 #b7094c;" onclick="Game.showStats()">Estadísticas</button>
    </div>

    <!-- Pantalla de Juego -->
    <div id="screen-game" class="screen hidden" style="justify-content: flex-start; padding: 0;">
        <div class="hud-concurso">
            <span id="txt-score">Puntos: 0</span>
            <span id="txt-round">Ronda: 1/10</span>
        </div>
        <div class="timer-bar" id="timer-bar"></div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 20px;">
            <p id="txt-instruccion" style="color: #06d6a0; font-weight: bold;">Resuelve:</p>
            <div class="panel-pregunta" id="txt-pregunta">7 × 8</div>
            <div class="grid-opciones" id="grid-opciones"></div>
        </div>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="screen-result" class="screen hidden">
        <h2>¡Concurso Terminado!</h2>
        <p id="res-texto" style="font-size: 1.2rem; margin: 20px 0;">Has completado el reto.</p>
        <button class="btn" onclick="Game.returnHome()">Volver al Menú</button>
    </div>

    <!-- Pantalla de Estadísticas -->
    <div id="screen-stats" class="screen hidden">
        <h2>Tus Estadísticas</h2>
        <p id="stats-content" style="font-size: 1.2rem; line-height: 1.8;">Cargando...</p>
        <button class="btn" onclick="Game.returnHome()">Volver</button>
    </div>
</div>

<script>
const Sound = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(type) {
        try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            const now = this.ctx.currentTime;
            if (type === 'correct') {
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        } catch(e){}
    }
};

const Storage = {
    key: 'mision_multiplica_concurso_v5',
    load() {
        try {
            const data = localStorage.getItem(this.key);
            if (data) return JSON.parse(data);
        } catch(e){}
        return { points: 0, gamesPlayed: 0 };
    },
    save(st) {
        try { localStorage.setItem(this.key, JSON.stringify(st)); } catch(e){}
    }
};

const Game = {
    mode: 'tablas',
    hasTimer: false, // Por defecto en FALSO (Sin tiempo)
    score: 0,
    round: 1,
    maxRounds: 10,
    currentAnswer: 0,
    timerInterval: null,
    timeLeft: 100,

    toggleTimerMode() {
        this.hasTimer = !this.hasTimer;
        const btn = document.getElementById('btn-mode-toggle');
        if (this.hasTimer) {
            btn.innerHTML = "⚡ Modo: CON TIEMPO (Reto rápido)";
            btn.style.background = "#ef476f";
            btn.style.borderColor = "#ffd166";
            btn.style.boxShadow = "0 4px 0 #b7094c";
        } else {
            btn.innerHTML = "🐢 Modo: SIN TIEMPO (Calma absoluta)";
            btn.style.background = "#06d6a0";
            btn.style.borderColor = "#ffd166";
            btn.style.boxShadow = "0 4px 0 #049a72";
        }
    },

    startMode(mode) {
        this.mode = mode;
        this.score = 0;
        this.round = 1;
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        this.nextQuestion();
    },

    nextQuestion() {
        if (this.round > this.maxRounds) {
            this.endGame();
            return;
        }
        document.getElementById('txt-round').innerText = `Ronda: ${this.round}/${this.maxRounds}`;
        document.getElementById('txt-score').innerText = `Puntos: ${this.score}`;

        let f1, f2, questionText, correctAnswer;

        if (this.mode === 'tablas') {
            f1 = Math.floor(Math.random() * 9) + 2;
            f2 = Math.floor(Math.random() * 9) + 2;
            correctAnswer = f1 * f2;
            questionText = `${f1} × ${f2}`;
        } else {
            let a = Math.floor(Math.random() * 6) + 2;
            let b = Math.floor(Math.random() * 6) + 2;
            let c = Math.floor(Math.random() * 10) + 1;
            correctAnswer = (a * b) + c;
            questionText = `(${a} × ${b}) + ${c}`;
        }

        this.currentAnswer = correctAnswer;
        
        let options = [correctAnswer];
        while(options.length < 4) {
            let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
            let wrong = correctAnswer + offset;
            if (wrong > 0 && !options.includes(wrong)) options.push(wrong);
        }
        options.sort(() => Math.random() - 0.5);

        document.getElementById('txt-pregunta').innerText = questionText;
        const grid = document.getElementById('grid-opciones');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opcion-btn';
            btn.innerText = opt;
            
            const selectAnswer = (e) => {
                e.preventDefault();
                clearInterval(this.timerInterval);
                if (opt === this.currentAnswer) {
                    Sound.play('correct');
                    this.score += 100;
                    btn.style.background = '#06d6a0';
                } else {
                    Sound.play('wrong');
                    btn.style.background = '#ef476f';
                }
                setTimeout(() => {
                    this.round++;
                    this.nextQuestion();
                }, 500);
            };

            btn.addEventListener('touchstart', selectAnswer, {passive:false});
            btn.addEventListener('click', selectAnswer);
            grid.appendChild(btn);
        });

        this.startTimer();
    },

    startTimer() {
        const bar = document.getElementById('timer-bar');
        clearInterval(this.timerInterval);

        if (!this.hasTimer) {
            bar.style.width = '100%';
            bar.style.background = '#06d6a0';
            return;
        }

        bar.style.background = '#ef476f';
        this.timeLeft = 100;

        this.timerInterval = setInterval(() => {
            this.timeLeft -= 1.0;
            bar.style.width = Math.max(0, this.timeLeft) + '%';
            if (this.timeLeft <= 0) {
                clearInterval(this.timerInterval);
                Sound.play('wrong');
                this.round++;
                this.nextQuestion();
            }
        }, 100);
    },

    endGame() {
        clearInterval(this.timerInterval);
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('res-texto').innerText = `Has conseguido ${this.score} puntos. ¡Gran trabajo!`;

        let st = Storage.load();
        st.points += this.score;
        st.gamesPlayed++;
        Storage.save(st);
    },

    showStats() {
        let st = Storage.load();
        document.getElementById('stats-content').innerHTML = `
            Partidas jugadas: <strong>${st.gamesPlayed}</strong><br>
            Puntuación total: <strong>${st.points} pts</strong>
        `;
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-stats').classList.remove('hidden');
    },

    returnHome() {
        clearInterval(this.timerInterval);
        ['screen-game', 'screen-result', 'screen-stats'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById('screen-home').classList.remove('hidden');
    }
};
</script>
</body>
</html>
