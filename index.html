<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión Multiplica: Edición Cifras</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #app {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 700px;
            background: #1b263b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }
        header {
            background: #4158D0;
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd166;
            text-shadow: 2px 2px 0px #0d1b2a;
            border-bottom: 4px solid #118ab2;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .hidden {
            display: none !important;
        }
        h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #ffd166;
        }
        p {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #e0fbfc;
        }
        .btn {
            background-color: #06d6a0;
            color: #0d1b2a;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #049a72;
            margin: 8px;
            width: 80%;
            max-width: 280px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #049a72;
        }
        .btn-secondary {
            background-color: #118ab2;
            box-shadow: 0 4px 0 #0b5c77;
            color: white;
        }
        .speed-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .speed-btn {
            background: #2b2d42;
            border: 2px solid #8d99ae;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .speed-btn.active {
            background: #06d6a0;
            color: #0d1b2a;
            border-color: #ffd166;
        }
        /* Zona de juego / Concurso */
        .hud-concurso {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            border-bottom: 2px solid #118ab2;
        }
        .panel-pregunta {
            font-size: 2.5rem;
            color: #ffd166;
            margin: 15px 0;
            background: #0d1b2a;
            padding: 15px 30px;
            border-radius: 15px;
            border: 3px solid #118ab2;
            letter-spacing: 2px;
        }
        .grid-opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        .opcion-btn {
            background: #2b2d42;
            border: 3px solid #8d99ae;
            color: white;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        .timer-bar {
            width: 100%;
            height: 8px;
            background: #ef476f;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="app">
    <header>Misión Multiplica: Edición Cifras</header>

    <!-- Pantalla de Inicio -->
    <div id="screen-home" class="screen">
        <h2>¡Gran Concurso Mental!</h2>
        <p>Elige tu ritmo y pon a prueba las matemáticas.</p>
        
        <p style="margin-bottom: 5px; font-size: 0.9rem; color: #ffd166;">Selecciona la velocidad del tiempo:</p>
        <div class="speed-selector">
            <button class="speed-btn active" id="spd-1" onclick="Game.setSpeed(1)">Muy Lento (Tranquilo)</button>
            <button class="speed-btn" id="spd-2" onclick="Game.setSpeed(2)">Normal</button>
            <button class="speed-btn" id="spd-3" onclick="Game.setSpeed(3)">Rápido (Reto)</button>
        </div>

        <button class="btn" onclick="Game.startMode('tablas')">Tablas de Multiplicar</button>
        <button class="btn btn-secondary" onclick="Game.startMode('cifras')">Cifras Exactas (Combinadas)</button>
        <button class="btn" style="background:#ef476f; box-shadow: 0 4px 0 #b7094c;" onclick="Game.showStats()">Estadísticas</button>
    </div>

    <!-- Pantalla de Juego -->
    <div id="screen-game" class="screen hidden" style="justify-content: flex-start; padding-top: 10px;">
        <div class="hud-concurso">
            <span id="txt-score">Puntos: 0</span>
            <span id="txt-round">Ronda: 1/10</span>
        </div>
        <div class="timer-bar" id="timer-bar"></div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%;">
            <p id="txt-instruccion" style="color: #06d6a0; font-weight: bold;">Calcula sin prisa:</p>
            <div class="panel-pregunta" id="txt-pregunta">7 × 8</div>
            <div class="grid-opciones" id="grid-opciones"></div>
        </div>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="screen-result" class="screen hidden">
        <h2 id="res-titulo">¡Concurso Terminado!</h2>
        <p id="res-texto">Has conseguido una puntuación fantástica.</p>
        <button class="btn" onclick="Game.returnHome()">Menú Principal</button>
    </div>

    <!-- Pantalla de Estadísticas -->
    <div id="screen-stats" class="screen hidden">
        <h2>Tus Estadísticas</h2>
        <p id="stats-content">Cargando...</p>
        <button class="btn btn-secondary" onclick="Game.returnHome()">Volver</button>
    </div>
</div>

<script>
const Sound = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(type) {
        try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            const now = this.ctx.currentTime;

            if (type === 'correct') {
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        } catch(e){}
    }
};

const Storage = {
    key: 'mision_multiplica_concurso_v2',
    load() {
        try {
            const data = localStorage.getItem(this.key);
            if (data) return JSON.parse(data);
        } catch(e){}
        return { points: 0, gamesPlayed: 0 };
    },
    save(st) {
        try { localStorage.setItem(this.key, JSON.stringify(st)); } catch(e){}
    }
};

const Game = {
    mode: 'tablas',
    speedLevel: 1, // 1 = Muy lento, 2 = Normal, 3 = Rápido
    score: 0,
    round: 1,
    maxRounds: 10,
    currentAnswer: 0,
    timerInterval: null,
    timeLeft: 100,

    setSpeed(lvl) {
        this.speedLevel = lvl;
        document.querySelectorAll('.speed-btn').forEach((b, index) => {
            if (index + 1 === lvl) b.classList.add('active');
            else b.classList.remove('active');
        });
    },

    startMode(mode) {
        this.mode = mode;
        this.score = 0;
        this.round = 1;
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        this.nextQuestion();
    },

    nextQuestion() {
        if (this.round > this.maxRounds) {
            this.endGame();
            return;
        }
        document.getElementById('txt-round').innerText = `Ronda: ${this.round}/${this.maxRounds}`;
        document.getElementById('txt-score').innerText = `Puntos: ${this.score}`;

        let f1, f2, questionText, correctAnswer;

        if (this.mode === 'tablas') {
            f1 = Math.floor(Math.random() * 9) + 2;
            f2 = Math.floor(Math.random() * 9) + 2;
            correctAnswer = f1 * f2;
            questionText = `${f1} × ${f2}`;
            document.getElementById('txt-instruccion').innerText = "Tómate tu tiempo y calcula:";
        } else {
            const opType = Math.random();
            if (opType < 0.5) {
                let a = Math.floor(Math.random() * 6) + 2;
                let b = Math.floor(Math.random() * 6) + 2;
                let c = Math.floor(Math.random() * 10) + 1;
                correctAnswer = (a * b) + c;
                questionText = `(${a} × ${b}) + ${c}`;
            } else {
                let a = Math.floor(Math.random() * 8) + 3;
                let b = Math.floor(Math.random() * 8) + 3;
                let c = Math.floor(Math.random() * 5) + 1;
                correctAnswer = (a * b) - c;
                questionText = `(${a} × ${b}) - ${c}`;
            }
            document.getElementById('txt-instruccion').innerText = "Resuelve la cifra exacta:";
        }

        this.currentAnswer = correctAnswer;
        
        let options = [correctAnswer];
        while(options.length < 4) {
            let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
            let wrong = correctAnswer + offset;
            if (wrong > 0 && !options.includes(wrong)) {
                options.push(wrong);
            }
        }
        options.sort(() => Math.random() - 0.5);

        document.getElementById('txt-pregunta').innerText = questionText;
        const grid = document.getElementById('grid-opciones');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opcion-btn';
            btn.innerText = opt;
            const selectAnswer = (e) => {
                e.preventDefault();
                clearInterval(this.timerInterval);
                if (opt === this.currentAnswer) {
                    Sound.play('correct');
                    this.score += 100;
                    btn.style.background = '#06d6a0';
                } else {
                    Sound.play('wrong');
                    btn.style.background = '#ef476f';
                }
                setTimeout(() => {
                    this.round++;
                    this.nextQuestion();
                }, 600);
            };
            btn.addEventListener('touchstart', selectAnswer, {passive:false});
            btn.addEventListener('click', selectAnswer);
            grid.appendChild(btn);
        });

        this.startTimer();
    },

    startTimer() {
        this.timeLeft = 100;
        const bar = document.getElementById('timer-bar');
        clearInterval(this.timerInterval);

        // Ajustar la velocidad según lo que el usuario haya seleccionado en el menú
        // Nivel 1 = Muy Lento (resta 0.5 por tick), Nivel 2 = Normal (1), Nivel 3 = Rápido (2)
        let decrement = 0.5;
        if (this.speedLevel === 2) decrement = 1.0;
        if (this.speedLevel === 3) decrement = 2.0;

        this.timerInterval = setInterval(() => {
            this.timeLeft -= decrement;
            bar.style.width = Math.max(0, this.timeLeft) + '%';
            if (this.timeLeft <= 0) {
                clearInterval(this.timerInterval);
                Sound.play('wrong');
                this.round++;
                this.nextQuestion();
            }
        }, 100);
    },

    endGame() {
        clearInterval(this.timerInterval);
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('res-titulo').innerText = "¡Concurso Terminado!";
        document.getElementById('res-texto').innerText = `Has conseguido ${this.score} puntos. ¡Gran trabajo mental!`;

        let st = Storage.load();
        st.points += this.score;
        st.gamesPlayed++;
        Storage.save(st);
    },

    showStats() {
        let st = Storage.load();
        document.getElementById('stats-content').innerHTML = `
            Partidas jugadas: <strong>${st.gamesPlayed}</strong><br>
            Puntuación total: <strong>${st.points} pts</strong>
        `;
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-stats').classList.remove('hidden');
    },

    returnHome() {
        clearInterval(this.timerInterval);
        ['screen-game', 'screen-result', 'screen-stats'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById('screen-home').classList.remove('hidden');
    }
};
</script>
</body>
</html>
