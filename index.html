function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = (Math.random()*(i+1))|0;
    const t = a[i]; a[i]=a[j]; a[j]=t;
  }

}
function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

/* =========================================================
   4. ESTADO
   ========================================================= */
const DEFAULT_STATE = {
  world:0, unlocked:1, coins:0, xp:0,
  correct:0, wrong:0, streak:0, bestStreak:0,
  facts:{}, badges:[], completed:[], muted:false
};
let state = loadState();

function loadState(){
  const s = JSON.parse(JSON.stringify(DEFAULT_STATE));
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ raw = null; }
  if(raw && typeof raw === 'object'){
    for(const k in DEFAULT_STATE){
      if(k === 'facts' || k === 'badges' || k === 'completed') continue;
      if(typeof raw[k] === typeof DEFAULT_STATE[k] && raw[k] !== null) s[k] = raw[k];
    }
    if(raw.facts && typeof raw.facts === 'object') s.facts = raw.facts;
    if(Array.isArray(raw.badges)) s.badges = raw.badges.slice();
    if(Array.isArray(raw.completed)) s.completed = raw.completed.slice();
    if(typeof raw.gems === 'number' && !raw.coins) s.coins = raw.gems;
  }
  s.world = clamp(s.world|0, 0, LEVELS.length-1);
  s.unlocked = clamp(s.unlocked|0, 1, LEVELS.length);
  s.coins = Math.max(0, s.coins|0);
  s.xp = Math.max(0, s.xp|0);
  s.streak = Math.max(0, s.streak|0);
  s.bestStreak = Math.max(s.bestStreak|0, s.streak);
  return s;
}
function saveState(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){}

const canvas = $('game');
const ctx = canvas.getContext('2d');
let DPR = 1;
let canvasRect = null;

function resize(){
  const stage = $('stage');
  const r = stage.getBoundingClientRect();
  if(r.width < 20 || r.height < 20) return;
  const pad = 10;
  const s = Math.min((r.width - pad*2)/W, (r.height - pad*2)/H);
  const cw = Math.max(180, Math.floor(W*s));
  const ch = Math.max(101, Math.floor(H*s));
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.floor(W*DPR), bh = Math.floor(H*DPR);
  if(canvas.width !== bw)  canvas.width  = bw;
  if(canvas.height !== bh) canvas.height = bh;
  canvasRect = canvas.getBoundingClientRect();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  invalidateGradients();
}
window.addEventListener('resize', ()=>{ canvasRect = null; resize(); });
window.addEventListener('orientationchange', ()=>setTimeout(()=>{ canvasRect = null; resize(); }, 150));

/* =========================================================
   6. AUDIO
   ========================================================= */
let actx = null;
function initAudio(){
  if(actx){ if(actx.state === 'suspended') actx.resume(); return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }catch(e){ actx = null; }
}
function tone(f, dur, type, vol, delay){
  if(!actx || state.muted) return;
  try{
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function sfx(name){
  if(!actx || state.muted) return;
  switch(name){
    case 'jump':    tone(420,0.10,'square',0.06); tone(660,0.09,'square',0.05,0.05); break;
    case 'coin':    tone(1046,0.07,'sine',0.09);  tone(1568,0.09,'sine',0.07,0.05); break;
    case 'crystal': tone(880,0.09,'triangle',0.10); tone(1320,0.13,'triangle',0.09,0.06); break;

   ========================================================= */
const particles = [];
function burst(x, y, n, color, power){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = rnd(0.6, power || 2.6);
    particles.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-0.8,
      life: rnd(28,55), max: 55, size: rnd(2,4.6), color});
  }
  if(particles.length > 200) particles.splice(0, particles.length-200);
}
function updateParticles(){
  if(particles.length === 0) return;
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.09; p.vx *= 0.985;
    if(--p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(){
  if(particles.length === 0) return;
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let gradCache = { sky: { level: -1, grad: null }, player: null, enemy: null, door: { key: '', grad: null } };
function invalidateGradients(){
  gradCache.sky.level = -1;
  gradCache.door.key = '';
  gradCache.player = null;
  gradCache.enemy = null;
}
function getSkyGrad(){
  if(gradCache.sky.level !== level.index || !gradCache.sky.grad){
    gradCache.sky.level = level.index;
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, level.sky[0]);
    g.addColorStop(1, level.sky[1]);
    gradCache.sky.grad = g;
  }
  return gradCache.sky.grad;
}
function getPlayerGrad(){
  if(!gradCache.player){
    const g = ctx.createLinearGradient(0,-38,0,-2);
    g.addColorStop(0,'#8ef0d0'); g.addColorStop(1,'#37a98b');
    gradCache.player = g;
  }
  return gradCache.player;
}
function getEnemyGrad(){
  if(!gradCache.enemy){
    const g = ctx.createLinearGradient(0,-26,0,0);
    g.addColorStop(0,'#8fe07f'); g.addColorStop(1,'#3f9c4e');
    gradCache.enemy = g;
  }
  return gradCache.enemy;
}
function getDoorGrad(open){
  const key = level.index + '_' + (open?1:0);
  if(gradCache.door.key !== key){
    gradCache.door.key = key;
    const d = level.door;
    const g = ctx.createRadialGradient(d.x+d.w/2, d.y+d.h/2, 4, d.x+d.w/2, d.y+d.h/2, 70);
    g.addColorStop(0, open ? 'rgba(255,212,92,0.75)' : 'rgba(255,212,92,0.4)');
    g.addColorStop(1, 'rgba(255,212,92,0)');
    gradCache.door.grad = g;
  }
  return gradCache.door.grad;
}

const miniGame = {
  active: false, type: null, mode: null, returnTo: 'play',
  questions: [], currentIdx: 0, correctCount: 0,
  requiredCorrect: 3, totalQuestions: 5,
  phase: 'aim', timer: 0, isCorrect: false,

};

function getMiniGameTitle(t){
  if(t === 'soccer')  return '⚽ ¡Penalti matemático!';
  if(t === 'bowling') return '🎳 ¡Bolos numéricos!';
  if(t === 'archery') return '🏹 ¡Tiro con arco!';
  if(t === 'magic')   return '🪜 ¡Escalera mágica!';
  return '🔐 ¡Portal matemático!';
}

function startMiniGame(opts){
  opts = opts || {};
  miniGame.active = true;
  miniGame.mode = opts.mode || 'portal';
  miniGame.returnTo = opts.returnTo || 'play';
  miniGame.type = opts.type || MG_TYPES[(Math.random()*MG_TYPES.length)|0];
  miniGame.requiredCorrect = opts.requiredCorrect || PORTAL_NEED;
  miniGame.totalQuestions = opts.totalQuestions || PORTAL_TOTAL;
  miniGame.correctCount = 0;
  miniGame.currentIdx = 0;
  miniGame.questions = [];
  game.mode = 'minigame';

  if(miniGame.type === 'magic'){
    initMagic();
  } else {
    for(let i=0;i<miniGame.totalQuestions;i++) miniGame.questions.push(makeQuestion());
    initMiniGameStage();
  }
  updateHud();
  toast(getMiniGameTitle(miniGame.type));
}

function initMiniGameStage(){
  miniGame.phase = 'aim'; miniGame.timer = 0; miniGame.isCorrect = false;
  miniGame.projectile = null; miniGame.resultText = ''; miniGame.resultSub = '';
  const q = miniGame.questions[miniGame.currentIdx];
  if(!q) return;

  if(miniGame.type === 'soccer'){
    const gx=200, gy=90, gw=400, gh=170, zw=gw/2, zh=gh/2;
    miniGame.elements = [];
    for(let i=0;i<4;i++){
      const col = i%2, row = (i/2)|0;
      miniGame.elements.push({
        x: gx+col*zw, y: gy+row*zh, w: zw, h: zh,
        cx: gx+col*zw+zw/2, cy: gy+row*zh+zh/2,
        val: q.choices[i], hit:false
      });
    }
    miniGame.projectile = { startX: 400, startY: 400, endX: 0, endY: 0 };
  } else if(miniGame.type === 'bowling'){
    const pinY = 130, xs = [230, 350, 470, 590];
    miniGame.elements = xs.map((x,i) => ({
      x: x, y: pinY, w: 26, h: 70, cx: x+13, cy: pinY+35,
      val: q.choices[i], hit:false, fall: 0
    }));
    miniGame.projectile = { startX: 410, startY: 420, endX: 0, endY: 0 };
  } else if(miniGame.type === 'archery'){
    const pos = [{x:170,y:175},{x:340,y:130},{x:540,y:175},{x:680,y:130}];
    miniGame.elements = pos.map((p,i) => ({
      x: p.x, y: p.y, r: 46, cx: p.x, cy: p.y,
      val: q.choices[i], hit:false
    }));
    miniGame.projectile = { startX: 70, startY: 380, endX: 0, endY: 0 };
  } else {
    const positions = [{x:120,y:240},{x:440,y:240},{x:120,y:340},{x:440,y:340}];
    miniGame.elements = positions.map((p,i) => ({
      x: p.x, y: p.y, w: 240, h: 80, cx: p.x+120, cy: p.y+40,
      val: q.choices[i], hit:false
    }));
    miniGame.projectile = null;
  }
}

function updateMiniGame(){
  if(!miniGame.active) return;
  if(miniGame.type === 'magic'){ updateMagic(); return; }

  miniGame.timer++;
  if(miniGame.phase === 'flying'){
    const t = Math.min(1, miniGame.timer / 32);
    const p = miniGame.projectile;
    if(miniGame.type === 'soccer'){
      miniGame.projectilePos.x = p.startX + (p.endX - p.startX) * t;
      miniGame.projectilePos.y = p.startY + (p.endY - p.startY) * t - Math.sin(t*Math.PI)*70;
    } else if(miniGame.type === 'bowling'){
      miniGame.projectilePos.x = p.startX + (p.endX - p.startX) * t;
      miniGame.projectilePos.y = p.startY + (p.endY - p.startY) * t;
    } else if(miniGame.type === 'archery'){
      miniGame.projectilePos.x = p.startX + (p.endX - p.startX) * t;
      miniGame.projectilePos.y = p.startY + (p.endY - p.startY) * t - Math.sin(t*Math.PI)*110;
    }
    if(t >= 1){
      const q2 = miniGame.questions[miniGame.currentIdx];
      const key = q2.a + 'x' + q2.b;
      const st = state.facts[key] || (state.facts[key] = {c:0, w:0});
      if(miniGame.isCorrect){
        st.c++; state.correct++; state.streak++;
        if(state.streak > state.bestStreak) state.bestStreak = state.streak;
        state.xp += 5; state.coins += 2;
        miniGame.correctCount++;
        miniGame.resultText = (miniGame.type === 'soccer') ? '¡GOOOL! ⚽'
                            : (miniGame.type === 'bowling') ? '¡PLENO! 🎳'
                            : '¡DIANA! 🏹';
        if(miniGame.type === 'soccer')  sfx('goal');
        else if(miniGame.type === 'bowling') sfx('strike');
        else sfx('bullseye');
        burst(p.endX, p.endY, 24, '#ffd45c', 4);
        if(miniGame.type === 'soccer')  award('soccer');
        if(miniGame.type === 'bowling') award('bowling');
        if(miniGame.type === 'archery') award('archery');
      } else {
        st.w++; state.wrong++; state.streak = 0;
        miniGame.resultText = '¡Casi!';
        miniGame.resultSub = q2.a + ' × ' + q2.b + ' = ' + q2.ans;
        sfx('wrong');
      }
      checkBadges(); saveState(); updateHud();
      miniGame.phase = 'result'; miniGame.timer = 0;
    }
  } else if(miniGame.phase === 'result'){
    const limit = miniGame.isCorrect ? FEEDBACK_OK : FEEDBACK_KO;
    if(miniGame.timer > limit){
      miniGame.currentIdx++;
      if(miniGame.correctCount >= miniGame.requiredCorrect) finishMiniGame(true);
      else if(miniGame.currentIdx >= miniGame.totalQuestions) finishMiniGame(false);
      else initMiniGameStage();
    }
  }
}

function handleMiniGameTap(x, y){
  if(miniGame.type === 'magic'){ handleMagicTap(x, y); return; }
  if(miniGame.phase === 'result' && miniGame.timer > SKIP_AFTER){
    // saltar feedback
    miniGame.currentIdx++;
    if(miniGame.correctCount >= miniGame.requiredCorrect) finishMiniGame(true);
    else if(miniGame.currentIdx >= miniGame.totalQuestions) finishMiniGame(false);
    else initMiniGameStage();
    return;
  }
  if(miniGame.phase !== 'aim') return;
  const el = getTappedElement(x, y);
  if(!el) return;
  selectMiniGameElement(el);
}
function handleMiniGameKey(n){
  if(miniGame.type === 'magic'){ handleMagicKey(n); return; }
  if(miniGame.phase === 'result' && miniGame.timer > SKIP_AFTER){
    miniGame.currentIdx++;
    if(miniGame.correctCount >= miniGame.requiredCorrect) finishMiniGame(true);
    else if(miniGame.currentIdx >= miniGame.totalQuestions) finishMiniGame(false);
    else initMiniGameStage();
    return;
  }
  if(miniGame.phase !== 'aim') return;
  if(n < 0 || n >= miniGame.elements.length) return;
  selectMiniGameElement(miniGame.elements[n]);
}
function getTappedElement(x, y){
  for(const el of miniGame.elements){
    if(el.r){
      const dx = x - el.x, dy = y - el.y;
      if(dx*dx + dy*dy < el.r*el.r) return el;
    } else {
      if(x >= el.x && x <= el.x+el.w && y >= el.y && y <= el.y+el.h) return el;
    }
  }
  return null;
}
function selectMiniGameElement(el){
  const q = miniGame.questions[miniGame.currentIdx];
  miniGame.isCorrect = (el.val === q.ans);
  el.hit = true;
  miniGame.phase = 'flying';
  miniGame.timer = 0;
  const p = miniGame.projectile;
  if(miniGame.type === 'soccer'){ p.endX = el.cx; p.endY = el.cy; sfx('kick'); }
  else if(miniGame.type === 'bowling'){ p.endX = el.cx; p.endY = el.cy; sfx('bowl'); }
  else if(miniGame.type === 'archery'){ p.endX = el.cx; p.endY = el.cy; sfx('arrow'); }
  else {
    const key = q.a + 'x' + q.b;
    const st = state.facts[key] || (state.facts[key] = {c:0, w:0});
    if(miniGame.isCorrect){
      st.c++; state.correct++; state.streak++;
      if(state.streak > state.bestStreak) state.bestStreak = state.streak;
      state.xp += 5; state.coins += 2;
      miniGame.correctCount++;
      miniGame.resultText = '¡CORRECTO! 🌟';
      sfx('correct');
    } else {
      st.w++; state.wrong++; state.streak = 0;
      miniGame.resultText = '¡Casi!';
      miniGame.resultSub = q.a + ' × ' + q.b + ' = ' + q.ans;
      sfx('wrong');
    }
    checkBadges(); saveState(); updateHud();
    miniGame.phase = 'result'; miniGame.timer = 0;
  }
}

function finishMiniGame(success){
  miniGame.phase = 'summary';
  const isPortal = miniGame.mode === 'portal';
  const title = $('mgTitle'), body = $('mgBody'), retry = $('mgRetry'), cont = $('mgContinue');

  if(success){
    title.textContent = isPortal ? '🏆 ¡Portal desbloqueado!' : '🎉 ¡Práctica completada!';
    body.innerHTML =
      '<p>Aciertos: <b>' + miniGame.correctCount + '</b> de ' + miniGame.totalQuestions + '</p>' +
      '<p>⭐ +' + (miniGame.correctCount*5) + ' XP · 🪙 +' + (miniGame.correctCount*2) + ' monedas</p>' +
      (isPortal ? '<p style="color:#8fe8c4">¡Corre a tocar el portal!</p>' : '');
    retry.style.display = 'none';
    cont.textContent = isPortal ? 'Volver al mundo' : 'Volver';
  } else {
    title.textContent = isPortal ? '🔒 Portal bloqueado' : '📘 ¡A seguir practicando!';
    body.innerHTML =
      '<p>Aciertos: <b>' + miniGame.correctCount + '</b> de ' + miniGame.totalQuestions + '</p>' +
      '<p>Necesitas <b>' + miniGame.requiredCorrect + '</b>. ¡La próxima vez lo harás mejor!</p>';
    retry.style.display = 'block';
    retry.textContent = '🔁 Intentar otra vez';
    cont.textContent = isPortal ? 'Volver al mundo' : 'Volver';
  }
  $('ovMinigame').classList.remove('hidden');

  cont.onclick = function(){
    $('ovMinigame').classList.add('hidden');
    miniGame.active = false;
    if(isPortal){
      if(success) game.doorOpen = true;
      game.mode = 'play'; game.doorLock = true;
    } else if(miniGame.returnTo === 'welcome'){
      game.mode = 'menu';
      $('ovWelcome').classList.remove('hidden');
    } else {
      game.mode = 'play'; game.doorLock = true;
    }
    lastTime = 0; acc = 0;
  };
  retry.onclick = function(){
    $('ovMinigame').classList.add('hidden');
    startMiniGame({
      mode: miniGame.mode, returnTo: miniGame.returnTo, type: miniGame.type,
      requiredCorrect: miniGame.requiredCorrect, totalQuestions: miniGame.totalQuestions
    });
    lastTime = 0; acc = 0;
  };
}

const magic = {
  step: 0,          // 0..total (total = win)
  total: 8,
  question: null,
  phase: 'ask',     // 'ask' | 'correct' | 'wrong'
  timer: 0,
  tappedIdx: -1,
  hint: '',
  buttons: [],
  steps: [],        // posiciones de los peldaños
  celebrate: 0
};

function initMagic(){
  magic.step = 0;
  magic.total = 8;
  magic.phase = 'ask';
  magic.timer = 0;
  magic.tappedIdx = -1;
  magic.hint = '';
  magic.buttons = [];
  magic.celebrate = 0;

  // Peldaños: de abajo-izquierda a arriba-derecha
  magic.steps = [];
  for(let i=0; i<=magic.total; i++){
    magic.steps.push({
      x: 100 + i * 78,
      y: 250 - i * 18
    });
  }
  magic.question = makeQuestion();
}

function updateMagic(){
  if(magic.celebrate > 0){
    magic.celebrate++;
    if(magic.celebrate > 45){
      magic.celebrate = 0;
      finishMagic(true);
    }
    return;
  }
  if(magic.phase === 'correct'){
    magic.timer++;
    if(magic.timer > FEEDBACK_OK){
      if(magic.step >= magic.total){
        // ¡Victoria!
        magic.celebrate = 1;
        burst(700, 120, 40, '#ffd45c', 5);
        sfx('win');
        return;
      }
      magic.step++;
      magic.phase = 'ask';
      magic.timer = 0;
      magic.tappedIdx = -1;
      magic.hint = '';
      magic.question = makeQuestion();
      sfx('ladder');
      burst(magic.steps[magic.step].x, magic.steps[magic.step].y, 10, '#8effb0', 3);
    }
  }
  // 'wrong' no auto-avanza: el jugador debe tocar la respuesta correcta
}

function handleMagicTap(x, y){
  if(magic.phase === 'correct' && magic.timer > SKIP_AFTER){
    // saltar feedback correcto
    if(magic.step >= magic.total){
      magic.celebrate = 1;
      burst(700, 120, 40, '#ffd45c', 5);
      sfx('win');
      return;
    }
    magic.step++;
    magic.phase = 'ask';
    magic.timer = 0;
    magic.tappedIdx = -1;
    magic.hint = '';
    magic.question = makeQuestion();
    return;
  }
  if(magic.phase === 'ask' || magic.phase === 'wrong'){
    const btns = magicButtons();
    for(let i=0; i<btns.length; i++){
      const b = btns[i];
      if(x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h){
        answerMagic(i, b.val);
        return;
      }
    }
  }
}

function handleMagicKey(n){
  if(magic.phase === 'correct' && magic.timer > SKIP_AFTER){
    handleMagicTap(-1, -1);
    return;
  }
  const btns = magicButtons();
  if(n >= 0 && n < btns.length){
    answerMagic(n, btns[n].val);
  }
}

function answerMagic(idx, val){
  if(magic.phase === 'correct') return;
  const q = magic.question;
  magic.tappedIdx = idx;
  const correct = (val === q.ans);

  if(correct){
    magic.phase = 'correct';
    magic.timer = 0;
    magic.hint = '';
    const key = q.a + 'x' + q.b;
    const st = state.facts[key] || (state.facts[key] = {c:0, w:0});
    st.c++; state.correct++; state.streak++;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.xp += 5; state.coins += 2;
    checkBadges(); saveState(); updateHud();
    sfx('correct');
  } else {
    magic.phase = 'wrong';
    const key = q.a + 'x' + q.b;
    const st = state.facts[key] || (state.facts[key] = {c:0, w:0});
    st.w++; state.wrong++; state.streak = 0;
    saveState(); updateHud();
    sfx('wrong');
    magic.hint = 'La respuesta es ' + q.ans + '  ·  ' + hintText(q.a, q.b);
  }
}

function magicButtons(){
  // 4 botones en 2x2 en la parte inferior
  const bw = 300, bh = 62;
  return [
    {x: 60,  y: 300, w: bw, h: bh, val: magic.question.choices[0]},
    {x: 440, y: 300, w: bw, h: bh, val: magic.question.choices[1]},

    $('ovMinigame').classList.add('hidden');

function pickFact(){
  const pool = [];
  const add = (a,b,base)=>{
    const key = a + 'x' + b;
    const st = state.facts[key] || {c:0,w:0};
    let w = base + st.w*2.5;
    if(st.c > 0 && st.w === 0) w *= 0.55;
    if(st.w > 0) w += 1.5;
    pool.push({a:a, b:b, w: Math.max(0.4, w)});
  };
  const tables = LEVELS[game.levelIndex].tables;
  for(let i=0;i<tables.length;i++){
    for(let b=1;b<=10;b++) add(tables[i], b, 1);
  }
  if(game.levelIndex > 0 && Math.random() < 0.35){
    const prev = [];
    for(let i=0;i<game.levelIndex;i++){
      LEVELS[i].tables.forEach(t=>{ if(prev.indexOf(t)===-1) prev.push(t); });
    }
    if(prev.length){
      add(prev[rndInt(0, prev.length-1)], rndInt(1,10), 2.2);
    }
  }
  let total = 0;
  for(let i=0;i<pool.length;i++) total += pool[i].w;
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r -= pool[i].w;
    if(r <= 0) return pool[i];
  }
  return pool[pool.length-1];
}
function makeChoices(a, b, ans){
  const set = new Set([ans]);
  const cands = [];
  for(let k=1;k<=10;k++){
    if(a*k !== ans) cands.push(a*k);
    if(b*k !== ans) cands.push(b*k);
  }
  cands.push(ans+1, ans-1, ans+2, ans-2, ans+10, ans-10,
             ans+a, ans-a, ans+b, ans-b, ans+3, ans-3);
  shuffle(cands);
  for(let i=0;i<cands.length && set.size<4;i++){
    const v = cands[i];
    if(v > 0 && v <= 120) set.add(v);
  }
  let n = 1;
  while(set.size < 4){ if(ans + n > 0) set.add(ans + n); n++; }
  return shuffle(Array.from(set));
}
function makeQuestion(){
  const f = pickFact();
  const ans = f.a * f.b;
  return { a:f.a, b:f.b, ans:ans, choices: makeChoices(f.a, f.b, ans) };
}
function hintText(a, b){
  if(b <= 4){
    const parts = [];
    for(let i=0;i<b;i++) parts.push(a);
    return b + ' veces ' + a + ' = ' + parts.join(' + ') + ' = ' + (a*b);
  }
  return 'Truco: ' + a + ' × ' + b + ' = ' + b + ' × ' + a + ' = ' + (a*b);
}

function buildLevel(index){
  const src = LEVELS[clamp(index,0,LEVELS.length-1)];

    index: index, name: src.name, tables: src.tables, style: src.style,

    platforms: src.platforms.map(p => ({x:p.x, y:p.y, w:p.w, h:p.h})),
    movers: (src.movers||[]).map(m => ({
      x:m.x, y:m.y, w:m.w, h:m.h,
      baseX:m.x, baseY:m.y, axis:m.axis, range:m.range, speed:m.speed,
      phase: Math.random()*6.28, dx:0, dy:0
    })),
    crystals: src.crystals.map(c => ({x:c[0], y:c[1], taken:false, ph:Math.random()*6.28})),
    coins: src.coins.map(c => ({x:c[0], y:c[1], taken:false, ph:Math.random()*6.28})),
    enemies: (src.enemies||[]).map(e => ({
      x:e.x, y:e.y, w:34, h:26, min:e.min, max:e.max,
      speed:e.speed||0.9, dir:1, stun:0, anim:0
    })),
    hazards: (src.hazards||[]).map(h => ({x:h.x, y:h.y, w:h.w, h:h.h, type:h.type||'lava'})),
    station: src.station ? {x:src.station.x, y:src.station.y, used:false, ph:Math.random()*6.28} : null,
    door: {x:src.door.x, y:src.door.y, w:src.door.w, h:src.door.h},
    solids: []
  };
  L.solids = L.platforms.concat(L.movers);
  L.stars = makeStars(index);
  L.decor = makeDecor(L);

}

/* =========================================================
   15. FÍSICA
   ========================================================= */
function moveX(P, dx){
  if(dx === 0) return;
  P.x += dx;
  for(let i=0;i<level.solids.length;i++){
    const s = level.solids[i];
    if(overlap(P, s)){
      if(dx > 0) P.x = s.x - P.w;
      else       P.x = s.x + s.w;
      P.vx = 0;
    }
  }
  if(P.x < 0){ P.x = 0; P.vx = 0; }
  if(P.x > W - P.w){ P.x = W - P.w; P.vx = 0; }
}
function moveY(P, dy){
  if(dy === 0) return;
  P.y += dy;
  for(let i=0;i<level.solids.length;i++){
    const s = level.solids[i];
    if(overlap(P, s)){
      if(dy > 0){
        P.y = s.y - P.h;
        P.landImpact = Math.max(P.landImpact, dy);
        P.vy = 0;
        P.onGround = true;
        P.carrier = s;
      } else {
        P.y = s.y + s.h;
        P.vy = 0;
      }
    }
  }
}
function updateMovers(){
  for(const m of level.movers){
    const px = m.x, py = m.y;
    m.phase += m.speed;
    if(m.axis === 'x') m.x = m.baseX + Math.sin(m.phase)*m.range;
    else               m.y = m.baseY + Math.sin(m.phase)*m.range;
    m.dx = m.x - px;
    m.dy = m.y - py;
  }
}
function updatePlayer(){
  const P = game.player;
  if(!P) return;
  if(P.carrier && P.carrier.dx) P.x = clamp(P.x + P.carrier.dx, 0, W - P.w);
  let dir = 0;
  if(input.left) dir -= 1;
  if(input.right) dir += 1;
  if(dir !== 0){ P.vx += dir*ACC; P.face = dir; }
  else { P.vx *= FRIC; if(Math.abs(P.vx) < 0.08) P.vx = 0; }
  P.vx = clamp(P.vx, -MAXVX, MAXVX);
  if(input.jumpBuffer > 0) input.jumpBuffer--;
  if(P.onGround) P.coyote = 8; else if(P.coyote > 0) P.coyote--;
  if(input.jumpBuffer > 0 && P.coyote > 0){
    P.vy = JUMP_V; P.coyote = 0; P.onGround = false; input.jumpBuffer = 0;
    P.squash = -0.6; sfx('jump');
    burst(P.x+P.w/2, P.y+P.h, 6, '#d9fff4', 1.6);
  }
  P.vy = Math.min(P.vy + GRAV, 15);
  P.onGround = false; P.carrier = null; P.landImpact = 0;
  moveX(P, P.vx);
  const steps = Math.max(1, Math.ceil(Math.abs(P.vy)/7));
  const stepY = P.vy / steps;
  for(let i=0;i<steps;i++) moveY(P, stepY);
  if(P.landImpact > 5){
    P.squash = 0.55; sfx('coin');
    burst(P.x+P.w/2, P.y+P.h, 4, '#ffffff', 1.1);
  }
  P.squash += (0 - P.squash)*0.18;
  if(Math.abs(P.squash) < 0.01) P.squash = 0;
  if(P.onGround && Math.abs(P.vx) > 0.5) P.anim += 0.22; else P.anim *= 0.9;
  if(P.invuln > 0) P.invuln--;
  if(P.y > H + 80) respawnPlayer(true);
}
function respawnPlayer(silent){
  const P = game.player;
  P.x = P.spawn.x; P.y = P.spawn.y;
  P.vx = 0; P.vy = 0; P.onGround = false; P.carrier = null; P.invuln = 90;
  game.shake = 8;
  burst(P.x+P.w/2, P.y+P.h/2, 12, '#ff9c9c', 2.4);
  if(!silent){ sfx('hurt'); toast('¡Uy! Vuelve a intentarlo 💪'); }
}

/* =========================================================
   16. ENEMIGOS Y OBJETOS
   ========================================================= */
function updateEnemies(){
  const P = game.player;
  for(const e of level.enemies){
    if(e.stun > 0){ e.stun--; continue; }
    e.anim += 0.12;
    e.x += e.speed * e.dir;
    if(e.x < e.min){ e.x = e.min; e.dir = 1; }
    if(e.x + e.w > e.max){ e.x = e.max - e.w; e.dir = -1; }
    if(P.invuln > 0) continue;
    if(!overlap(P, e)) continue;
    const stomping = P.vy > 1 && (P.y + P.h) < (e.y + e.h*0.7);
    if(stomping){
      e.stun = 120; P.vy = -9.5;
      state.coins++; state.xp += 1;
      sfx('stomp');
      burst(e.x+e.w/2, e.y, 8, '#ffd45c', 2.2);
      updateHud(); saveState();
    } else {
      const away = (P.x+P.w/2) < (e.x+e.w/2) ? -1 : 1;
      P.vx = away * 5.5; P.vy = -6.5; P.invuln = 70; game.shake = 7;
      sfx('hurt');
      burst(P.x+P.w/2, P.y+P.h/2, 10, '#ff9c9c', 2.4);
      toast('¡Cuidado con el slime! 😅');
    }
  }
}
function checkCollectibles(){
  const P = game.player;
  const px = P.x+P.w/2, py = P.y+P.h/2;
  for(const c of level.crystals){
    if(c.taken) continue;
    const dx = px-c.x, dy = py-c.y;
    if(dx*dx + dy*dy < 900){
      c.taken = true; game.found++;
      state.coins++; state.xp += 3;
      sfx('crystal');
      burst(c.x, c.y, 16, '#72f5ff', 3);
      toast('¡Cristal ' + game.found + ' de ' + REQUIRED_GEMS + '! ✨');
      updateHud(); saveState();
    }
  }
  for(const co of level.coins){
    if(co.taken) continue;
    const dx = px-co.x, dy = py-co.y;
    if(dx*dx + dy*dy < 676){
      co.taken = true; state.coins++; state.xp++;
      sfx('coin');
      burst(co.x, co.y, 8, '#ffd45c', 2);
      updateHud(); saveState();
    }
  }
}
function checkHazards(){
  const P = game.player;
  if(P.invuln > 0) return;
  for(const hz of level.hazards){
    if(overlap(P, hz)){ respawnPlayer(false); return; }
  }
}
function checkStation(){
  const st = level.station;
  if(!st || st.used) return;
  const P = game.player;
  const cx = P.x+P.w/2, cy = P.y+P.h/2;
  const dx = cx-st.x, dy = cy-st.y;
  if(dx*dx + dy*dy < 1400){
    st.used = true;
    burst(st.x, st.y, 20, '#c9aaff', 3);
    startMiniGame({
      mode: 'practice', returnTo: 'play',
      type: STATION_TYPES[(Math.random()*STATION_TYPES.length)|0],
      requiredCorrect: STATION_NEED, totalQuestions: STATION_TOTAL
    });
  }
}
function checkDoor(){
  const P = game.player;
  const d = level.door;
  const touching = P.x+P.w > d.x && P.x < d.x+d.w && P.y+P.h > d.y && P.y < d.y+d.h;
  if(!touching){ game.doorLock = false; return; }
  if(game.doorLock) return;
  if(game.doorOpen){ winLevel(); return; }
  if(game.found >= REQUIRED_GEMS){
    startMiniGame({
      mode: 'portal', returnTo: 'play',
      requiredCorrect: PORTAL_NEED, totalQuestions: PORTAL_TOTAL
    });
  } else if(game.frame - game.lastDoorMsg > 110){
    game.lastDoorMsg = game.frame;
    toast('Necesitas ' + (REQUIRED_GEMS - game.found) + ' cristal(es) más 💎');
  }
}

function winLevel(){
  if(game.mode !== 'play') return;
  game.mode = 'done';
  if(state.completed.indexOf(game.levelIndex) === -1) state.completed.push(game.levelIndex);
  state.unlocked = clamp(Math.max(state.unlocked, game.levelIndex+2), 1, LEVELS.length);
  if(game.levelIndex + 1 > state.world) state.world = clamp(game.levelIndex+1, 0, LEVELS.length-1);
  state.xp += 25; state.coins += 5;
  if(game.wrongInLevel === 0) award('perfect');
  checkBadges();
  saveState();
  updateHud();
  sfx('win');
  showFinish();
}
function showFinish(){
  const isLast = game.levelIndex >= LEVELS.length-1;
  $('fTitle').textContent = isLast ? '🌟 ¡MISIÓN COMPLETADA! 🌟' : '🏆 ¡Mundo completado!';
  let html = '';
  html += '<p>Has recuperado el fragmento de <b>' + level.name + '</b>.</p>';
  html += '<p>💎 Cristales: ' + game.found + ' · 🪙 Monedas: ' + state.coins + ' · ⭐ XP: ' + state.xp + '</p>';

  if(got.length){
    html += '<div class="badges">' + got.map(b=>'<span>'+b.icon+' '+b.name+'</span>').join('') + '</div>';
  }

/* =========================================================
   18. BUCLE
   ========================================================= */
function update(){
  game.frame++;
  updateMovers();
  updatePlayer();
  updateEnemies();
  checkCollectibles();
  checkHazards();
  checkStation();
  checkDoor();
  if(game.shake > 0.3) game.shake *= 0.9; else game.shake = 0;
}
let lastTime = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime = ts;
  let dt = ts - lastTime;
  lastTime = ts;
  if(dt > 100) dt = 100;
  if(game.mode === 'play'){
    acc += dt;
    let guard = 0;
    while(acc >= STEP && guard < 5){ update(); acc -= STEP; guard++; }
    if(guard >= 5) acc = 0;
  } else if(game.mode === 'minigame'){
    updateMiniGame();
    acc = 0;
  } else {
    acc = 0;
  }
  updateParticles();
  render();
}

/* =========================================================
   19. RENDER PRINCIPAL
   ========================================================= */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function starShape(cx, cy, r, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rad = (i % 2) ? r*0.45 : r;
    const a = -Math.PI/2 + i*Math.PI/5;
    const x = cx + Math.cos(a)*rad;
    const y = cy + Math.sin(a)*rad;
    if(i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(game.mode === 'minigame'){ renderMiniGame(); return; }
  if(!level) return;
  if(game.shake > 0.3){
    ctx.translate(rnd(-game.shake, game.shake), rnd(-game.shake, game.shake));
  }
  drawSky(); drawDecor(); drawPlatforms(); drawHazards();
  drawStation(); drawCoins(); drawCrystals(); drawDoor();
  drawEnemies(); drawPlayer(); drawParticles(); drawCanvasHud();
}

function drawSky(){
  ctx.fillStyle = getSkyGrad();
  ctx.fillRect(0,0,W,H);
  if(level.style === 'galaxia' || level.style === 'portal' || level.style === 'volcan'){
    for(let i=0;i<level.stars.length;i++){
      const s = level.stars[i];
      const tw = 0.55 + 0.45*Math.sin(game.frame*0.05 + s.tw);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
function drawDecor(){
  const d = level.decor;
  for(let i=0;i<d.length;i++){
    const it = d[i];
    if(it.t === 'hill'){
      ctx.fillStyle = 'rgba(20,70,110,0.45)';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, Math.PI, 0); ctx.fill();
    } else if(it.t === 'cloud'){
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.s, 0, Math.PI*2);
      ctx.arc(it.x+it.s*0.9, it.y+4, it.s*0.75, 0, Math.PI*2);
      ctx.arc(it.x-it.s*0.9, it.y+5, it.s*0.65, 0, Math.PI*2);
      ctx.fill();
    } else if(it.t === 'leaf'){
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.fillStyle = 'rgba(10,60,35,0.45)';
      ctx.beginPath(); ctx.ellipse(0,0,it.s*0.55, it.s*0.22, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(it.t === 'tree'){
      ctx.fillStyle = 'rgba(8,40,25,0.35)';
      ctx.fillRect(it.x-8, it.y-it.s, 16, it.s);
      ctx.beginPath(); ctx.arc(it.x, it.y-it.s, it.s*0.55, 0, Math.PI*2); ctx.fill();
    } else if(it.t === 'mount'){
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.moveTo(it.x-it.s, it.y); ctx.lineTo(it.x, it.y-it.s*0.85); ctx.lineTo(it.x+it.s, it.y);
      ctx.closePath(); ctx.fill();
    } else if(it.t === 'smoke'){
      const t = (game.frame*0.006 + i*0.3) % 1;
      ctx.globalAlpha = 0.2*(1-t);
      ctx.fillStyle = '#3a1a12';
      ctx.beginPath(); ctx.arc(it.x, it.y-t*160, it.s*(1+t), 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if(it.t === 'snow'){
      it.y += it.sp; if(it.y > H) it.y = -4;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.s, 0, Math.PI*2); ctx.fill();
    } else if(it.t === 'planet'){
      ctx.fillStyle = 'rgba(180,140,255,0.35)';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(200,180,255,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(it.x, it.y, it.s*1.7, it.s*0.5, 0.5, 0, Math.PI*2); ctx.stroke();
    } else if(it.t === 'spark'){
      const tw = 0.4 + 0.6*Math.abs(Math.sin(game.frame*0.03 + i));
      ctx.globalAlpha = tw; ctx.fillStyle = '#f0c9ff';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.s, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if(it.t === 'ring'){
      ctx.strokeStyle = 'rgba(255,200,255,' + (0.1 + 0.05*Math.sin(game.frame*0.03 + i)) + ')';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(it.x, it.y, it.s, 0, Math.PI*2); ctx.stroke();
    }
  }
}

function drawDoor(){
  const d = level.door;
  const open = game.doorOpen;
  const pulse = 0.5 + 0.5*Math.sin(game.frame*0.08);
  ctx.save();
  if(open){
    ctx.fillStyle = getDoorGrad(true);
    ctx.fillRect(d.x-70, d.y-70, d.w+140, d.h+140);
  }
  ctx.fillStyle = open ? '#ffd45c' : '#8a93c9';
  rr(d.x-4, d.y-4, d.w+8, d.h+8, 12); ctx.fill();
  if(open){
    const g2 = ctx.createLinearGradient(d.x, d.y, d.x+d.w, d.y+d.h);
    g2.addColorStop(0, '#fff8d0');
    g2.addColorStop(0.5, '#ffc93c');
    g2.addColorStop(1, '#ff8a3c');
    ctx.fillStyle = g2;
  } else ctx.fillStyle = '#3a4370';
  rr(d.x+2, d.y+2, d.w-4, d.h-4, 9); ctx.fill();
  if(open){
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(d.x+d.w/2, d.y+d.h/2 + Math.sin(game.frame*0.05+i)*6,
              d.w*0.22 + i*6, game.frame*0.06+i, game.frame*0.06+i+2.4);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#b9c4f5';
    ctx.fillRect(d.x+d.w/2-7, d.y+22, 14, 12);
    ctx.strokeStyle = '#b9c4f5';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(d.x+d.w/2, d.y+22, 6, Math.PI, 0); ctx.stroke();
  }
  if(!open){
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    rr(d.x-14, d.y-32, d.w+28, 22, 10); ctx.fill();
    ctx.fillStyle = game.found >= REQUIRED_GEMS ? '#7dffb0' : '#ffe89a';
    ctx.font = 'bold 13px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(game.found + ' / ' + REQUIRED_GEMS + ' 💎', d.x+d.w/2, d.y-17);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('¡ENTRA!', d.x+d.w/2, d.y-14 + Math.sin(game.frame*0.1)*3);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}
function drawEnemies(){

function drawPlayer(){
  const P = game.player;
  if(!P) return;
  if(P.invuln > 0 && (game.frame >> 2) % 2 === 0) return;
  const cx = P.x + P.w/2, by = P.y + P.h, t = game.frame * 0.15;
  const walking = P.onGround && Math.abs(P.vx) > 0.6;
  const bob = walking ? Math.sin(t*1.6)*1.5 : 0;
  const sq = P.squash;
  const stretch = P.onGround ? 0 : clamp(-P.vy*0.018, -0.10, 0.16);
  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(1 + sq*0.25 - stretch*0.5, 1 - sq*0.25 + stretch);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 4.5, 0, 0, Math.PI*2); ctx.fill();
  const legPhase = walking ? Math.sin(t*1.6) : 0;
  ctx.fillStyle = '#2b3a63';
  rr(-9, -8+legPhase*2, 7, 9, 3); ctx.fill();
  rr( 2, -8-legPhase*2, 7, 9, 3); ctx.fill();
  ctx.fillStyle = getPlayerGrad();
  ctx.beginPath(); ctx.ellipse(0, -20+bob, 15, 17, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#d9fff4';
  ctx.beginPath(); ctx.ellipse(0, -15+bob, 9, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#37a98b';
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  const armY = P.onGround ? -12 : -30;
  ctx.beginPath(); ctx.moveTo(-13, -20+bob); ctx.lineTo(-19, armY+bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 13, -20+bob); ctx.lineTo( 19, armY+bob); ctx.stroke();
  const look = P.face * 1.8;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(-5+look*0.3, -24+bob, 4.6, 5.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5+look*0.3, -24+bob, 4.6, 5.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1b2340';
  ctx.beginPath(); ctx.arc(-5+look, -24+bob, 2.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 5+look, -24+bob, 2.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,170,0.55)';
  ctx.beginPath(); ctx.arc(-9, -18+bob, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 9, -18+bob, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#1b2340'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -18+bob, 3.2, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -36+bob); ctx.lineTo(0, -44+bob); ctx.stroke();
  starShape(0, -48+bob, 5, '#ffe98a');
  ctx.restore();
}

   20. RENDER MINI-JUEGOS (4 clásicos)
   ========================================================= */
function renderMiniGame(){
  if(miniGame.type === 'magic'){ renderMagic(); return; }
  const q = miniGame.questions[miniGame.currentIdx];
  if(!q) return;
  if(miniGame.type === 'soccer')       drawMiniGameSoccer(q);
  else if(miniGame.type === 'bowling') drawMiniGameBowling(q);
  else if(miniGame.type === 'archery') drawMiniGameArchery(q);
  else                                 drawMiniGameQuiz(q);
  drawMiniGameHeader(q);
  if(miniGame.phase === 'result') drawMiniGameResult(q);
  drawParticles();
}
function drawMiniGameHeader(q){
  ctx.fillStyle = 'rgba(10,16,38,0.82)';
  rr(20, 8, W-40, 54, 16); ctx.fill();
  ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 2;
  rr(20, 8, W-40, 54, 16); ctx.stroke();
  ctx.fillStyle = '#ffd45c';
  ctx.font = 'bold 26px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(q.a + ' × ' + q.b + ' = ?', W/2, 36);
  ctx.fillStyle = 'rgba(10,16,38,0.7)';
  rr(20, H-34, 200, 24, 12); ctx.fill();
  ctx.fillStyle = '#8fe8c4';
  ctx.font = 'bold 13px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Pregunta ' + (miniGame.currentIdx+1) + '/' + miniGame.totalQuestions, 32, H-18);
  ctx.fillStyle = 'rgba(10,16,38,0.7)';
  rr(W-200, H-34, 180, 24, 12); ctx.fill();
  ctx.fillStyle = '#ffd45c';
  ctx.textAlign = 'right';

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}
function drawMiniGameResult(q){
  const fadeIn = Math.min(1, miniGame.timer/20);
  ctx.globalAlpha = fadeIn;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if(miniGame.isCorrect){
    const scale = 1 + Math.sin(miniGame.timer*0.15)*0.04;
    ctx.save();
    ctx.translate(W/2, H/2-20);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#7dffb0';
    ctx.font = 'bold 52px "Trebuchet MS",sans-serif';
    ctx.fillText(miniGame.resultText, 0, 0);
    ctx.restore();
    ctx.fillStyle = '#ffd45c';
    ctx.font = 'bold 22px "Trebuchet MS",sans-serif';
    ctx.fillText(q.a + ' × ' + q.b + ' = ' + q.ans, W/2, H/2 + 45);
  } else {
    ctx.fillStyle = '#ff9c9c';
    ctx.font = 'bold 46px "Trebuchet MS",sans-serif';
    ctx.fillText(miniGame.resultText, W/2, H/2 - 40);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 32px "Trebuchet MS",sans-serif';
    ctx.fillText(q.a + ' × ' + q.b + ' = ' + q.ans, W/2, H/2 + 10);
    ctx.fillStyle = '#b9c4f5';
    ctx.font = '16px "Trebuchet MS",sans-serif';
    ctx.fillText(hintText(q.a, q.b), W/2, H/2 + 55);
  }
  if(miniGame.timer > SKIP_AFTER){
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '14px "Trebuchet MS",sans-serif';
    ctx.fillText('👆 Toca para continuar', W/2, H - 20);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* --- SOCCER --- */
function drawMiniGameSoccer(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#2a6db5'); g.addColorStop(0.6, '#7bc4f0'); g.addColorStop(1, '#3a9c5c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0, 270, W, H-270);
  for(let i=0;i<W;i+=80){
    ctx.fillStyle = (i/80) % 2 === 0 ? '#43a047' : '#4caf50';
    ctx.fillRect(i, 270, 80, H-270);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(150, 280, 500, 130);
  const gx=200, gy=90, gw=400, gh=170;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(gx+6, gy+6, gw, gh);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  for(let i=0;i<=gw;i+=20){ ctx.beginPath(); ctx.moveTo(gx+i, gy); ctx.lineTo(gx+i, gy+gh); ctx.stroke(); }
  for(let i=0;i<=gh;i+=20){ ctx.beginPath(); ctx.moveTo(gx, gy+i); ctx.lineTo(gx+gw, gy+i); ctx.stroke(); }
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8;
  ctx.strokeRect(gx, gy, gw, gh);
  for(const el of miniGame.elements){
    let bg = 'rgba(0,0,0,0.5)';
    if(miniGame.phase === 'result' && el.hit){
      bg = miniGame.isCorrect ? 'rgba(120,255,160,0.65)' : 'rgba(255,120,120,0.65)';
    }
    ctx.fillStyle = bg;
    ctx.fillRect(el.x+6, el.y+6, el.w-12, el.h-12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(el.val, el.cx, el.cy);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let bx = 400, by = 410;
  if(miniGame.phase !== 'aim' && miniGame.projectilePos){ bx = miniGame.projectilePos.x; by = miniGame.projectilePos.y; }
  drawSoccerBall(bx, by, 16);
  if(miniGame.phase === 'aim'){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 16px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👆 Toca la zona con la respuesta correcta', W/2, 260);
    ctx.textAlign = 'left';
  }
}
function drawSoccerBall(x, y, r){
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y+r+4, r*0.9, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#222';
  const pent = [[0,-r*0.45],[-r*0.5,-r*0.1],[r*0.5,-r*0.1],[-r*0.3,r*0.4],[r*0.3,r*0.4]];
  ctx.beginPath();
  for(let i=0;i<pent.length;i++){
    if(i===0) ctx.moveTo(x+pent[i][0], y+pent[i][1]);
    else ctx.lineTo(x+pent[i][0], y+pent[i][1]);
  }
  ctx.closePath(); ctx.fill();
}

/* --- BOWLING --- */
function drawMiniGameBowling(){
  ctx.fillStyle = '#1a1030'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2a1b4a'; ctx.fillRect(0, 60, W, 60);
  const laneY = 200, laneH = 210;
  ctx.fillStyle = '#c89b5c'; ctx.fillRect(150, laneY, 500, laneH);
  ctx.strokeStyle = 'rgba(120,80,40,0.4)'; ctx.lineWidth = 1;
  for(let i=0;i<10;i++){
    ctx.beginPath();
    ctx.moveTo(150+(i+0.5)*50, laneY);
    ctx.lineTo(150+(i+0.5)*50, laneY+laneH);
    ctx.stroke();
  }
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(150, laneY, 500, 8);
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(120, laneY, 30, laneH);
  ctx.fillRect(650, laneY, 30, laneH);
  for(const el of miniGame.elements) drawBowlingPin(el);
  let bx = 410, by = 400;
  if(miniGame.phase !== 'aim' && miniGame.projectilePos){ bx = miniGame.projectilePos.x; by = miniGame.projectilePos.y; }
  drawBowlingBall(bx, by, 18);
  if(miniGame.phase === 'aim'){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 16px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👆 Toca el bolo con la respuesta correcta', W/2, 185);
    ctx.textAlign = 'left';
  }
}
function drawBowlingPin(el){
  ctx.save();
  ctx.translate(el.cx, el.cy);
  if(el.hit && miniGame.isCorrect && miniGame.phase === 'result'){
    el.fall = Math.min(1, miniGame.timer/20);
    ctx.rotate(el.fall * Math.PI * 0.5);
  }
  const w = el.w, h = el.h;
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.moveTo(-w/2, h/2);
  ctx.quadraticCurveTo(-w*0.55, 0, -w*0.28, -h*0.35);
  ctx.quadraticCurveTo(-w*0.2, -h/2, 0, -h/2);
  ctx.quadraticCurveTo(w*0.2, -h/2, w*0.28, -h*0.35);
  ctx.quadraticCurveTo(w*0.55, 0, w/2, h/2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e04545';
  ctx.fillRect(-w*0.24, -h*0.3, w*0.48, 5);
  ctx.fillRect(-w*0.24, -h*0.2, w*0.48, 5);
  ctx.fillStyle = '#222';
  ctx.font = 'bold 16px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(el.val, 0, 4);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawBowlingBall(x, y, r){
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y+r+3, r*0.95, 4, 0, 0, Math.PI*2); ctx.fill();
  const g = ctx.createRadialGradient(x-r*0.3, y-r*0.3, 2, x, y, r);
  g.addColorStop(0, '#5a5a5a'); g.addColorStop(1, '#1a1a1a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x-5, y-4, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+4, y-5, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+1, y+3, 2.4, 0, Math.PI*2); ctx.fill();
}

/* --- ARCHERY --- */
function drawMiniGameArchery(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d2a4a'); g.addColorStop(0.5, '#3f7cb8'); g.addColorStop(1, '#7bc46f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(40,90,50,0.7)';
  ctx.beginPath(); ctx.arc(150, 400, 140, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(600, 410, 180, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#3a7a44'; ctx.fillRect(0, 380, W, H-380);
  for(const el of miniGame.elements) drawArcheryTarget(el);
  drawArcher();
  if(miniGame.phase !== 'aim' && miniGame.projectilePos){
    drawArrow(miniGame.projectilePos.x, miniGame.projectilePos.y);
  }
  if(miniGame.phase === 'aim'){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 16px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👆 Toca la diana con la respuesta correcta', W/2, 375);
    ctx.textAlign = 'left';
  }
}
function drawArcheryTarget(el){
  ctx.save();
  ctx.translate(el.x, el.y);
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(-3, 0, 6, 60);
  const colors = ['#ffffff','#000000','#3b82f6','#ef4444','#facc15'];
  const radii = [el.r, el.r*0.8, el.r*0.6, el.r*0.4, el.r*0.2];
  for(let i=0;i<colors.length;i++){
    ctx.fillStyle = colors[i];
    ctx.beginPath(); ctx.arc(0, 0, radii[i], 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.beginPath(); ctx.arc(0, 0, el.r*0.55, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(el.val, 0, 2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawArcher(){
  const x = 70, y = 380;
  ctx.fillStyle = '#2b3a63';
  ctx.fillRect(x-10, y-4, 8, 25);
  ctx.fillRect(x+2, y-4, 8, 25);
  ctx.fillStyle = '#37a98b';
  ctx.beginPath(); ctx.ellipse(x, y-20, 12, 16, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffdbac';
  ctx.beginPath(); ctx.arc(x, y-40, 10, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x+15, y-30, 30, -Math.PI/2, Math.PI/2); ctx.stroke();
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x+15, y-60); ctx.lineTo(x+5, y-30); ctx.lineTo(x+15, y);
  ctx.stroke();
}
function drawArrow(x, y){
  ctx.save();
  ctx.translate(x, y);
  if(miniGame.projectile){
    const p = miniGame.projectile;
    const angle = Math.atan2(p.endY-p.startY, p.endX-p.startX);
    const t = miniGame.timer / 32;
    const tilt = Math.cos(t*Math.PI)*0.6;
    ctx.rotate(angle + tilt);
  }
  ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(10, 0); ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(4,-5); ctx.lineTo(4,5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d32f2f';
  ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(-14,-5); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(-14,5); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* --- QUIZ --- */
function drawMiniGameQuiz(q){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a2247'); g.addColorStop(1, '#2c387a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cx = W/2, cy = 180;
  const pulse = 0.5 + 0.5*Math.sin(game.frame*0.05);
  ctx.globalAlpha = 0.5 + 0.3*pulse;
  ctx.fillStyle = '#ffd45c';
  ctx.beginPath(); ctx.arc(cx, cy, 85, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 3;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(cx, cy, 30+i*15, game.frame*0.04+i, game.frame*0.04+i+2.5);
    ctx.stroke();
  }
  for(const el of miniGame.elements){
    let fill = 'rgba(60,80,180,0.85)', stroke = '#8da5ff';
    // marcar SOLO el pulsado, y SOLO tras resolver
    if(miniGame.phase === 'result' && el.hit){
      if(miniGame.isCorrect){ fill = 'rgba(60,200,120,0.9)'; stroke = '#7dffb0'; }
      else { fill = 'rgba(220,80,80,0.9)'; stroke = '#ff9c9c'; }
    }
    // marcar también el correcto en verde si el jugador falló
    if(miniGame.phase === 'result' && !miniGame.isCorrect && el.val === q.ans && !el.hit){
      fill = 'rgba(60,200,120,0.7)'; stroke = '#7dffb0';
    }
    ctx.fillStyle = fill;
    rr(el.x, el.y, el.w, el.h, 16); ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 2;
    rr(el.x, el.y, el.w, el.h, 16); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 34px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(el.val, el.cx, el.cy);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/* =========================================================
   21. RENDER ESCALERA MÁGICA
   ========================================================= */
function renderMagic(){
  // Fondo cielo con estrellas
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e1440');
  g.addColorStop(0.6, '#3d2a7a');
  g.addColorStop(1, '#5c46a8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Estrellas
  for(let i=0;i<50;i++){
    const sx = (i * 137 + 30) % W;
    const sy = (i * 73 + 20) % 280;
    const tw = 0.5 + 0.5*Math.sin(game.frame*0.04 + i);
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Peldaños
  for(let i=0; i<=magic.total; i++){
    const s = magic.steps[i];
    // plataforma
    ctx.fillStyle = i <= magic.step ? '#ffd45c' : '#5a4a9a';
    rr(s.x - 40, s.y - 6, 80, 14, 5); ctx.fill();
    // número
    ctx.fillStyle = i <= magic.step ? '#3a2a00' : '#a8a0d0';
    ctx.font = 'bold 11px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(i === 0 ? '🚀' : (i === magic.total ? '🏆' : i), s.x, s.y);
  }

  // Numa (personaje) en el peldaño actual
  const ps = magic.steps[magic.step];
  drawMagicNuma(ps.x, ps.y - 6);

  // Flechas de subida (si acierta)
  if(magic.phase === 'correct' && magic.step < magic.total){
    const ns = magic.steps[magic.step + 1];
    ctx.strokeStyle = 'rgba(125,255,176,0.8)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(ps.x, ps.y - 30);
    ctx.lineTo(ns.x, ns.y - 30);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Header
  ctx.fillStyle = 'rgba(10,6,30,0.82)';
  rr(20, 8, W-40, 54, 16); ctx.fill();
  ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 2;
  rr(20, 8, W-40, 54, 16); ctx.stroke();
  ctx.fillStyle = '#ffd45c';
  ctx.font = 'bold 26px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(magic.question.a + ' × ' + magic.question.b + ' = ?', W/2, 36);

  // Progreso
  ctx.fillStyle = 'rgba(10,6,30,0.7)';
  rr(20, 68, 200, 24, 12); ctx.fill();
  ctx.fillStyle = '#8fe8c4';
  ctx.font = 'bold 13px "Trebuchet MS",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Peldaño ' + magic.step + ' / ' + magic.total, 32, 84);

  // Botones de respuesta
  const btns = magicButtons();
  for(let i=0; i<btns.length; i++){
    const b = btns[i];
    let fill = 'rgba(60,80,180,0.9)';
    let stroke = '#8da5ff';
    // Si ya se respondió (correcto o incorrecto)
    if(magic.tappedIdx === i && magic.phase === 'correct'){
      fill = 'rgba(60,200,120,0.95)'; stroke = '#7dffb0';
    } else if(magic.tappedIdx === i && magic.phase === 'wrong'){
      fill = 'rgba(220,80,80,0.95)'; stroke = '#ff9c9c';
    } else if(magic.phase === 'wrong' && b.val === magic.question.ans){
      fill = 'rgba(60,200,120,0.9)'; stroke = '#7dffb0';
    }
    ctx.fillStyle = fill;
    rr(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 3;
    rr(b.x, b.y, b.w, b.h, 16); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 34px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.val, b.x + b.w/2, b.y + b.h/2);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  // Feedback
  if(magic.phase === 'correct'){
    ctx.fillStyle = 'rgba(10,6,30,0.7)';
    rr(W/2 - 220, 260, 440, 32, 12); ctx.fill();
    ctx.fillStyle = '#7dffb0';
    ctx.font = 'bold 22px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('¡Correcto! +5 ⭐ +2 🪙', W/2, 276);
    if(magic.timer > SKIP_AFTER && magic.step < magic.total){
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = '13px "Trebuchet MS",sans-serif';
      ctx.fillText('👆 Toca para subir', W/2, 300);
    }
  } else if(magic.phase === 'wrong'){
    ctx.fillStyle = 'rgba(10,6,30,0.85)';
    rr(W/2 - 280, 250, 560, 44, 12); ctx.fill();
    ctx.fillStyle = '#ff9c9c';
    ctx.font = 'bold 18px "Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(magic.hint, W/2, 272);
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.font = '13px "Trebuchet MS",sans-serif';
    ctx.fillText('Toca la respuesta correcta para seguir', W/2, 296);
  }

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  drawParticles();
}

function drawMagicNuma(x, y){
  ctx.save();
  ctx.translate(x, y);
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 3.5, 0, 0, Math.PI*2); ctx.fill();
  // piernas
  ctx.fillStyle = '#2b3a63';
  ctx.fillRect(-8, -10, 6, 10);
  ctx.fillRect(2, -10, 6, 10);
  // cuerpo
  const pg = ctx.createLinearGradient(0, -30, 0, 0);
  pg.addColorStop(0, '#8ef0d0'); pg.addColorStop(1, '#37a98b');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.ellipse(0, -18, 13, 14, 0, 0, Math.PI*2); ctx.fill();
  // barriga
  ctx.fillStyle = '#d9fff4';
  ctx.beginPath(); ctx.ellipse(0, -14, 7, 8, 0, 0, Math.PI*2); ctx.fill();
  // ojos
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-4, -22, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 4, -22, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1b2340';
  ctx.beginPath(); ctx.arc(-4, -22, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 4, -22, 1.8, 0, Math.PI*2); ctx.fill();
  // antena + estrella
  ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, -38); ctx.stroke();
  starShape(0, -42, 4, '#ffe98a');
  ctx.restore();
}

/* =========================================================
   22. CONTROLES
   ========================================================= */
document.addEventListener('keydown', function(e){
  const k = e.key;
  if(k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' '){
    e.preventDefault();
  }
  if(game.mode === 'minigame'){
    if(k === ' '){ handleMiniGameKey(-1); return; }
    const n = parseInt(k, 10);
    if(n >= 1 && n <= 4){ handleMiniGameKey(n-1); return; }
    return;
  }
  if(e.repeat) return;
  if(k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left  = true;
  if(k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
  if(k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){
    if(game.mode === 'play') input.jumpBuffer = 8;
  }
}, {passive:false});
document.addEventListener('keyup', function(e){
  const k = e.key;
  if(k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left  = false;
  if(k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

function bindHold(el, onDown, onUp){
  el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    onDown();
  }, {passive:false});
  el.addEventListener('pointerup', function(e){ e.preventDefault(); onUp(); }, {passive:false});
  el.addEventListener('pointercancel', function(){ onUp(); });
  el.addEventListener('pointerleave', function(){ onUp(); });
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindHold($('btnLeft'),  ()=>{ input.left  = true; }, ()=>{ input.left  = false; });
bindHold($('btnRight'), ()=>{ input.right = true; }, ()=>{ input.right = false; });
$('btnJump').addEventListener('pointerdown', function(e){
  e.preventDefault();
  if(game.mode === 'play') input.jumpBuffer = 8;
}, {passive:false});
$('btnJump').addEventListener('contextmenu', e=>e.preventDefault());

canvas.addEventListener('pointerdown', function(e){
  if(game.mode !== 'minigame') return;
  e.preventDefault();
  if(!canvasRect) canvasRect = canvas.getBoundingClientRect();
  const x = (e.clientX - canvasRect.left) / canvasRect.width * W;
  const y = (e.clientY - canvasRect.top) / canvasRect.height * H;
  handleMiniGameTap(x, y);
}, {passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* =========================================================
   23. BOTONES
   ========================================================= */
$('btnPlay').addEventListener('click', function(){
  initAudio();
  $('ovWelcome').classList.add('hidden');
  startLevel(state.world);
  lastTime = 0; acc = 0;
});
$('btnSound').addEventListener('click', function(){
  state.muted = !state.muted;
  saveState();
  updateHud();
  if(!state.muted){ initAudio(); sfx('coin'); }
});
let resetArmed = false;
$('btnReset').addEventListener('click', function(){
  const b = $('btnReset');
  if(!resetArmed){
    resetArmed = true;
    b.textContent = '⚠️ ¿Seguro? Pulsa otra vez para borrar';
    setTimeout(function(){
      resetArmed = false;
      b.textContent = 'Reiniciar progreso';
    }, 4000);
    return;
  }
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  state = loadState();
  resetArmed = false;
  b.textContent = 'Reiniciar progreso';
  renderWelcomeBadges();
  updateHud();
  startLevel(0);
  game.mode = 'menu';
  $('ovWelcome').classList.remove('hidden');
  toast('Progreso reiniciado. ¡Empezamos de nuevo!');
});
$('btnNext').addEventListener('click', function(){
  $('ovFinish').classList.add('hidden');
  const next = game.levelIndex + 1;
  if(next < LEVELS.length) startLevel(next); else startLevel(0);
  lastTime = 0; acc = 0;
});
$('btnReplay').addEventListener('click', function(){
  $('ovFinish').classList.add('hidden');
  startLevel(game.levelIndex);
  lastTime = 0; acc = 0;
});
$('practiceGrid').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-mg]');
  if(!btn) return;
  initAudio();
  const type = btn.getAttribute('data-mg');
  $('ovWelcome').classList.add('hidden');
  if(type === 'magic'){
    startMiniGame({ mode: 'practice', returnTo: 'welcome', type: 'magic' });
  } else {
    startMiniGame({
      mode: 'practice', returnTo: 'welcome', type: type,
      requiredCorrect: PORTAL_NEED, totalQuestions: PORTAL_TOTAL
    });
  }
  lastTime = 0; acc = 0;
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    input.left = input.right = false;
    input.jumpBuffer = 0;
    saveState();
  } else {
    lastTime = 0; acc = 0;
    canvasRect = null;
  }
});
window.addEventListener('pagehide', saveState);

/* =========================================================
   24. ARRANQUE
   ========================================================= */
function init(){
  level = buildLevel(state.world);
  game.levelIndex = state.world;
  game.player = makePlayer(level.spawn);
  game.mode = 'menu';
  updateHud();
  renderWelcomeBadges();
  const info = $('welcomeInfo');
  if(state.unlocked > 1 || state.completed.length > 0){
    info.textContent = '▶ Continuarás en: ' + LEVELS[state.world].name +
                       ' (tablas del ' + LEVELS[state.world].tables.join(' y ') + ')';
  } else {
    info.textContent = 'Empiezas en: ' + LEVELS[0].name + ' (tablas del 1 y del 2)';
  }
  resize();
  setTimeout(resize, 60);
  setTimeout(resize, 300);
  requestAnimationFrame(loop);
}
init();

})();
